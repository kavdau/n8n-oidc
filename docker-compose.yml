# Example: n8n Community Edition with OIDC login through Pocket ID.
# Put n8n behind your reverse proxy (TLS) and fill in .env (see .env.example).

services:
  n8n:
    # Pin the version you tested; the hook uses n8n internals. See README "Upgrading".
    image: docker.n8n.io/n8nio/n8n:2.42.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Berlin}

      # --- OIDC hook --------------------------------------------------------
      EXTERNAL_HOOK_FILES: /opt/n8n-oidc/hooks.js
      EXTERNAL_FRONTEND_HOOKS_URLS: /assets/oidc-frontend-hook.js
      N8N_ADDITIONAL_NON_UI_ROUTES: auth

      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      OIDC_OWNER_EMAIL: ${OIDC_OWNER_EMAIL}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Sign in with Pocket ID}
      # OIDC_HIDE_PASSWORD_LOGIN: "true"
      # OIDC_AUTO_REDIRECT: "true"
    secrets:
      - oidc_client_secret
    volumes:
      - n8n_data:/home/node/.n8n
      - ./hooks.js:/opt/n8n-oidc/hooks.js:ro

secrets:
  oidc_client_secret:
    file: ./secrets/oidc_client_secret

volumes:
  n8n_data:
