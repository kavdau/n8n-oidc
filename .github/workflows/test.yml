name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, so a new n8n release that breaks the hook shows up before you upgrade.
  schedule:
    - cron: '17 5 * * 1'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test test/unit.test.js

  n8n:
    name: n8n ${{ matrix.n8n }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # stable = what n8n recommends for production, next = the upcoming release
        n8n: [stable, next]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install n8n@${{ matrix.n8n }}
        run: |
          mkdir -p .n8n-under-test && cd .n8n-under-test
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund --loglevel=error n8n@${{ matrix.n8n }}
          echo "N8N_BIN=$PWD/node_modules/n8n/bin/n8n" >> "$GITHUB_ENV"
          echo "Testing against n8n $(node -p "require('./node_modules/n8n/package.json').version")" >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end
        run: node --test --test-reporter=spec --test-timeout=400000 test/e2e.test.js

      - name: Browser
        run: |
          npm install --no-audit --no-fund --loglevel=error
          mkdir -p screenshots
          SCREENSHOT_DIR=$PWD/screenshots node --test --test-reporter=spec --test-timeout=400000 test/browser.test.js

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.n8n }}
          path: screenshots
          if-no-files-found: ignore
